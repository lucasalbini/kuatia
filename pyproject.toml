[project]
name = "kuatia"
version = "0.1.0"
description = "Kuatia — transcrição local de áudio/vídeo com Whisper acelerado por OpenVINO em hardware Intel."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Lucas Albini", email = "lucasalbini@gmail.com" }]
dependencies = [
    "openvino>=2024.6.0",
    "openvino-tokenizers>=2024.6.0",
    "optimum[openvino]>=1.23.0",
    "transformers>=4.45.0",
    "torch>=2.5.0",
    "numpy>=1.26.0",
    "librosa>=0.10.2",
    "soundfile>=0.12.1",
    "python-docx>=1.0.0",
]

[project.scripts]
kuatia-convert = "kuatia.convert_model:main"
kuatia-transcribe = "kuatia.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.6.9",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pre-commit>=4.0.0",
    "detect-secrets>=1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kuatia"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RET", "PTH"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.coverage.run]
source = ["src/kuatia"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
