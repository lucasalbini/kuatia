name: CI

on:
  pull_request:
    branches: [dev, prod]
  push:
    branches: [dev, prod]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint + Type check + Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install Python 3.12 via uv
        run: uv python install 3.12

      - name: Install ffmpeg + libs do Qt (PySide6 headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            libegl1 \
            libgl1 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libfontconfig1 \
            libxcb-cursor0

      - name: Install dependencies
        run: uv sync

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src/

      - name: Pytest
        # Cobertura medida em `src/kuatia/core/` (AC #4 — tests de CLI/convert_model
        # estão fora de escopo). PR para dev: gate em 80%; merge dev->prod: gate em 90%.
        run: uv run pytest -v --cov=src/kuatia/core --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  coverage-gate-prod:
    name: Coverage >= 90% (prod gate)
    if: github.base_ref == 'prod' || github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: coverage-xml
      - name: Enforce 90% total coverage
        run: |
          python - <<'EOF'
          import xml.etree.ElementTree as ET, sys
          tree = ET.parse("coverage.xml")
          rate = float(tree.getroot().attrib["line-rate"])
          pct = rate * 100
          print(f"Total coverage: {pct:.2f}%")
          if pct < 90:
              sys.exit(f"Coverage {pct:.2f}% < 90% obrigatório para prod")
          EOF
